<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container">

    <h1>Volleyball Positions</h1>

    <div class="row">

        <div class="col-12 col-md-6 col-lg-4">
            <div class="border p-3">
                <h2>Setter</h2>
                <p>The setter passes the ball.</p>
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
            <div class="border p-3">
                <h2>Libero</h2>
                <p>The libero plays defense.</p>
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
            <div class="border p-3">
                <h2>Spiker</h2>
                <p>The spiker attacks the ball.</p>
            </div>
        </div>

    </div>

</div>

</body>
</html>
