<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volleyball</title>

    <style>
        body {
            font-family: Arial;
        }

        h1 {
            font-size: 24px;
        }

        p {
            font-size: 14px;
        }

        @media (min-width: 768px) {
            h1 {
                font-size: 32px;
            }

            p {
                font-size: 18px;
            }
        }

        @media (min-width: 992px) {
            h1 {
                font-size: 40px;
            }

            p {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <h1>Volleyball</h1>

    <p>
        Volleyball is a team sport. Two teams play against each other
        and try to score points.
    </p>

</body>
</html>
